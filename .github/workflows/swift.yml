# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The macOS test runner has been observed to hang before executing the
    # first test (Swift Testing parallel executor produces no output); cap
    # the job so a stuck run fails fast instead of burning the 6-hour
    # runner limit.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        swift: ["6.3.3"]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Swift
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: ${{ matrix.swift }}

    - name: Install mapnik (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libmapnik-dev mapnik-utils fonts-dejavu-core

    - name: Install mapnik (macOS)
      if: runner.os == 'macOS'
      run: brew install mapnik

    - name: Cache SwiftPM build
      uses: actions/cache@v4
      with:
        path: |
          .build
        key: ${{ runner.os }}-swift-${{ matrix.swift }}-${{ hashFiles('Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-swift-${{ matrix.swift }}-

    - name: Build
      run: CC=clang CXX=clang++ swift build

    - name: Test
      # --no-parallel: Swift Testing's parallel executor hung with no output
      # before the first test on the macOS runner with Swift 6.3.3.
      run: CC=clang CXX=clang++ swift test --no-parallel